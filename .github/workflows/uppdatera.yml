name: Uppdatera scoutrapporter

on:
  schedule:
    # Varannan timme 06–24 svensk tid. GitHub kör i UTC och kan försena schemalagda
    # körningar, så täta körningar gör att nya resultat kommer ut snabbare.
    - cron: "0 5-23/2 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bygg:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Återanvänd hämtade protokoll
        uses: actions/cache@v4
        with:
          path: .cache
          key: swehockey-${{ github.run_id }}
          restore-keys: swehockey-

      - name: Tester
        run: python -m unittest discover -s tests -t .

      - name: Bygg sidan
        run: python -m scout.site -q --web

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  publicera:
    needs: bygg
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
